<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindX Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row vh-100">
            <div class="col-12 md:col-6 lg:col-4 d-flex flex-column justify-content-center">
                <div class="fs-5xl fw-bold">REGISTER</div>
                <div class="form-floating my-6">
                    <label for="floatingInput">Email address</label>
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                </div>
                <div class="form-floating my-6">
                    <label for="floatingPassword">Password</label>
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                </div>
                <div class="form-floating my-6">
                    <label for="floatingPassword">Confirm password</label>
                    <input type="password" class="form-control" id="floatingConfirmPassword" placeholder="Confirm password">
                </div>
                <div class="my-6">
                    <a href="" class="fg-danger" style="text-decoration: none;">Already have an account?</a>
                </div>
                <button type="button" class="btn-solid fs-2xl fw-bold p-3 theme-danger my-6">Create new account</button>
            </div>
            <div class="col-12 md:col-6 lg:col-8 d-flex align-items-center">
                <img src="cinema2.jpg" class="img-fluid">
            </div>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
